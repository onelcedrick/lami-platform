name: CI - L'AMI Platform

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

env:
  GO_VERSION: "1.22"
  NODE_VERSION: "20"
  PYTHON_VERSION: "3.11"

jobs:
  backend-go:
    name: Backend Go (tests + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Test shared
        working-directory: backend/shared
        run: go mod tidy && go test ./pkg/jwt/ ./pkg/pdf/ -count=1 || go test ./pkg/jwt/ -count=1
      - name: Test Order
        working-directory: backend/services/order
        run: go mod tidy && go test ./internal/application/ -count=1 -v
      - name: Build gateway
        working-directory: backend/api-gateway
        run: go mod tidy && go build -o /tmp/gw ./cmd/main.go

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npm install
      - run: npx tsc --noEmit || true
