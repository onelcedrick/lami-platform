name: CD - Build & Push images

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build-images:
    name: Build Docker images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        include:
          - name: auth
            dockerfile: backend/services/auth/Dockerfile
            context: backend
          - name: catalog
            dockerfile: backend/services/catalog/Dockerfile
            context: backend
          - name: order
            dockerfile: backend/services/order/Dockerfile
            context: backend
          - name: ticket
            dockerfile: backend/services/ticket/Dockerfile
            context: backend
          - name: notification
            dockerfile: backend/services/notification/Dockerfile
            context: backend
          - name: user
            dockerfile: backend/services/user/Dockerfile
            context: backend
          - name: gateway
            dockerfile: backend/api-gateway/Dockerfile
            context: backend
          - name: ia
            dockerfile: backend/services/ia/Dockerfile
            context: backend

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image name
        id: meta
        run: |
          REPO=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "image=${{ env.REGISTRY }}/${REPO}/lami-${{ matrix.name }}" >> $GITHUB_OUTPUT
          echo "tag=${GITHUB_REF_NAME:-latest}" >> $GITHUB_OUTPUT

      - name: Build image
        run: |
          docker build \
            -f ${{ matrix.dockerfile }} \
            -t ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }} \
            -t ${{ steps.meta.outputs.image }}:latest \
            ${{ matrix.context }}

      - name: Push image
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          docker push ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
          docker push ${{ steps.meta.outputs.image }}:latest
